<style>
:root{
  --gold:#d4a24c; --gold-l:#f5d98a; --gold-d:#a8782a;
  --gold-grad:linear-gradient(135deg,#a8782a 0%,#e9b948 30%,#f7dc8f 50%,#e9b948 70%,#a8782a 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:#000}
body{min-height:100%;background:transparent}
body{
  font-family:'Cinzel',serif;color:#fff;overflow-x:hidden;
  display:flex;justify-content:center;
}
/* Fundo */
.bg{position:fixed;inset:0;z-index:-3;background:#000 url('fundo.jpg') center/cover no-repeat;transform:scale(1.04);animation:bgmove 40s ease-in-out infinite alternate}
@keyframes bgmove{to{transform:scale(1.07)}}
.veil{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(0,0,0,.50) 0%,rgba(0,0,0,.40) 45%,rgba(0,0,0,.78) 100%)}
#sparks{position:fixed;inset:0;z-index:-1;pointer-events:none}

.wrap{width:100%;max-width:460px;padding:max(34px,env(safe-area-inset-top)) 22px max(30px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;text-align:center}

/* Logo */
.logo{width:min(250px,64vw);filter:drop-shadow(0 4px 20px rgba(212,162,76,.35));
  opacity:0;animation:rise .9s .1s forwards, glow 7s 1s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 4px 24px rgba(247,220,143,.45))}}

.tag{margin-top:18px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;
  font-size:clamp(23px,6.4vw,29px);letter-spacing:.5px;
  background:var(--gold-grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;animation:rise .9s .3s forwards, shine 14s linear infinite}
@keyframes shine{to{background-position:200% center}}

.divider{display:flex;align-items:center;gap:12px;width:100%;margin:22px 0 22px;opacity:0;animation:rise .9s .45s forwards}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.divider i{width:7px;height:7px;background:var(--gold-l);transform:rotate(45deg);box-shadow:0 0 12px var(--gold)}

/* Botões */
.btns{width:100%;display:flex;flex-direction:column;gap:14px}
.btn{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;height:60px;padding:0 22px;border-radius:14px;
  text-decoration:none;color:var(--gold-l);
  font-weight:600;font-size:15px;letter-spacing:2.4px;text-transform:uppercase;
  background:linear-gradient(180deg,rgba(25,18,8,.78),rgba(0,0,0,.78));
  border:1px solid rgba(212,162,76,.7);
  box-shadow:0 8px 24px rgba(0,0,0,.55), inset 0 0 0 1px rgba(245,217,138,.08);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s,color .3s,border-color .3s;
  opacity:0;animation:rise .8s forwards;
}
.btns .btn:nth-child(1){animation-delay:.55s}
.btns .btn:nth-child(2){animation-delay:.67s}
.btns .btn:nth-child(3){animation-delay:.79s}
/* preenchimento dourado que sobe no hover */
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--gold-grad);background-size:200% 100%;
  transform:translateY(101%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
/* brilho que atravessa */
.btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;z-index:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);pointer-events:none}
.btn svg{width:21px;height:21px;flex:none;fill:currentColor;transition:transform .35s}
.btn span{position:relative;z-index:1}
.btn svg{position:relative;z-index:1}

@media (hover:hover){
  .btn:hover{color:#16100a;border-color:var(--gold-l);transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(0,0,0,.65),0 0 18px rgba(233,185,72,.32)}
  .btn:hover::before{transform:translateY(0)}
  .btn:hover::after{animation:sweep 1.4s}
  .btn:hover svg{transform:scale(1.08)}
}
.btn:active{transform:scale(.985);transition-duration:.12s;
  box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 20px rgba(247,220,143,.4);color:#16100a;border-color:var(--gold-l)}
.btn:active::before{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}
@keyframes sweep{to{left:130%}}

/* ripple no clique */
.ripple{position:absolute;border-radius:50%;background:rgba(255,236,170,.35);transform:scale(0);animation:rip 1s ease-out forwards;pointer-events:none;z-index:0}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* Redes sociais: 3 colunas idênticas */
.social{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.social .btn{height:92px;flex-direction:column;gap:9px;padding:0 6px;font-size:11px;letter-spacing:1.8px;border-radius:16px;
  opacity:0;animation:rise .8s forwards}
.social .btn:nth-child(1){animation-delay:.95s}
.social .btn:nth-child(2){animation-delay:1.05s}
.social .btn:nth-child(3){animation-delay:1.15s}
.social .btn svg{width:28px;height:28px}

.label{margin:26px 0 14px;font-size:11px;letter-spacing:5px;color:rgba(245,217,138,.8);text-transform:uppercase;opacity:0;animation:rise .8s .85s forwards}

.foot{margin-top:30px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:rgba(245,217,138,.6);letter-spacing:1px;opacity:0;animation:rise .8s 1.3s forwards}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<script>
/* ripple dourado ao clicar */
document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('pointerdown',e=>{
    const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('i');
    d.className='ripple';d.style.width=d.style.height=s+'px';
    d.style.left=(e.clientX-r.left-s/2)+'px';d.style.top=(e.clientY-r.top-s/2)+'px';
    b.appendChild(d);setTimeout(()=>d.remove(),700);
  });
});
/* partículas douradas */
(()=>{
  const c=document.getElementById('sparks'),x=c.getContext('2d');let W,H,P=[];
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
  const n=Math.min(22,Math.floor(innerWidth/30));
  for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.4,v:Math.random()*.35+.12,a:Math.random()*6.28,o:Math.random()*.35+.15});
  (function f(){
    x.clearRect(0,0,W,H);
    P.forEach(p=>{p.y-=p.v*.6;p.a+=.01;p.x+=Math.sin(p.a)*.3;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      const o=p.o*(.6+.4*Math.sin(p.a*3));
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fillStyle='rgba(247,217,138,'+o+')';x.shadowColor='#e9b948';x.shadowBlur=4;x.fill()});
    requestAnimationFrame(f)})();
})();
</script>
